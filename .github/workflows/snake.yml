name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: zowelqqee
          outputs: |
            dist/github-snake.svg?color_snake=#ff6b00&color_dots=#ebedf0,#d8b4fe,#a855f7,#7e22ce,#3b0764
            dist/github-snake-dark.svg?color_snake=#ffd500&color_dots=#0d1117,#083344,#0369a1,#06b6d4,#a5f3fc

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
